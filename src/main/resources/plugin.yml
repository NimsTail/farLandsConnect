name: UnityLauncher
version: '${project.version}'
main: com.frammy.unitylauncher.UnityLauncher
api-version: 1.20
authors: [ frammy, NimsTail ]
description: Connects with our Unity launcher
prefix: Unity Launcher
website: farlands.in
depend: [LuckPerms, UltimateAdvancementAPI]
softdepend: [BlueMap, TAB, PlaceholderAPI]
commands:
  brand:
    usage: "/brand [set <текст> | clear | info]"
    description: "Брендинг своих вещей"
    permission: "unity.brand"
    permission-message: "&cНет прав: unity.brand"
  unityLauncher:
    aliases: ul
    description: Для связи с нашим лаунчером
    usage: /<command> [subcommand]
    permission: unitylauncher.use
  register:
    description: Register password
    usage: /register <password>
    aliases: [reg]
    permission: unitylauncher.auth.register
  login:
    description: Login with password
    usage: /login <password>
    aliases: [l]
    permission: unitylauncher.auth.login

permissions:
  unity.brand:
    default: op
  unitylauncher.use:
    default: true
  unitylauncher.reload:
    description: Reload UnityLauncher configs and upgrades
    default: op
  unitylauncher.auth.register:
    default: true
  unitylauncher.auth.login:
    default: true