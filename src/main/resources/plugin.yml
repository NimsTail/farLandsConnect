name: UnityLauncher
version: '${project.version}'
main: com.frammy.unitylauncher.UnityLauncher
api-version: 1.20
authors: [ frammy, NimsTail ]
description: Connects with our Unity launcher
prefix: Unity Launcher
website: farlands.in
depend: [LuckPerms, UltimateAdvancementAPI, ProtocolLib, BlueMap]
softdepend: [TAB, PlaceholderAPI]
commands:
  brand:
    usage: /brand [set <текст> | clear | info]
    description: Брендинг своих вещей
    permission: unity.brand
    permission-message: "&cНет прав: unity.brand"
  unityLauncher:
    aliases: [ul]
    description: Для связи с нашим лаунчером
    usage: /<command> [subcommand]
    permission: unitylauncher.use
  register:
    aliases: [reg]
    description: Register password
    usage: /register <password>
    permission: unitylauncher.auth.register
  login:
    aliases: [l]
    description: Login with password
    usage: /login <password>
    permission: unitylauncher.auth.login
  state:
    description: Государственные апгрейды
    usage: /state <contract|focus|sampler|happyhour|recycle>
    permission: unitylauncher.state
    permission-message: "&cНет прав: unitylauncher.state"

permissions:
  unity.brand:
    default: op
  unitylauncher.use:
    default: true
  unitylauncher.reload:
    description: Reload UnityLauncher configs and upgrades
    default: op
  unitylauncher.money.give:
    description: Credit a player's real balance directly (/ul money give)
    default: op
  unitylauncher.frame.give:
    description: Grant a profile-wall frame directly (/ul frame give)
    default: op
  unitylauncher.auth.register:
    default: true
  unitylauncher.auth.login:
    default: true
  unitylauncher.state:
    default: true
  unitylauncher.state.happyhour:
    description: Настройка Happy Hour (проверка по роли страны внутри команды)
    default: true