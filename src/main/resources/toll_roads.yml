# Toll Roads: пошлина при въезде в страну (если у страны есть апгрейд stateTollRoadsPerm)
enabled: true

# Сколько снимаем с банковского баланса игрока (Ⓕ)
fee: 5.0

# Антиспам: минимум миллисекунд между оплатами
cooldown_ms: 15000

# Если денег нет — разворачиваем назад (телепорт на from)
deny_entry_if_cant_pay: false